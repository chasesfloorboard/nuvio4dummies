name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the collections still import into Nuvio
        run: |
          node tools/build-collection.js
          git diff --exit-code public/collections || { echo "Collections are out of date: run node tools/build-collection.js and commit"; exit 1; }
          for f in public/collections/*.json; do node tools/validate-collection.js "$f"; done

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/187076934426/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@nuvio4dummies.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: gcloud run deploy nuvio4dummies --source . --region us-west1 --project nuvio4dummies --quiet
